<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%8B%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Warm up TLS to the 3D-tile hosts before Cesium requests the first tile -->
    <link rel="preconnect" href="https://api.cesium.com" crossorigin />
    <link rel="preconnect" href="https://assets.ion.cesium.com" crossorigin />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <!--
      Between the markers stands what the prerender plugin (vite.config.ts)
      writes per page – the title, the description, the canonical URL, the
      language alternates and the link previews – and, below, the page's
      own content for a reader without the map (src/lib/site-pages.ts).
      What is here is the front door's, for a build without the plugin.
    -->
    <!-- page:head -->
    <title>Mini Germany 3D</title>
    <meta
      name="description"
      content="Der Nahverkehr deutscher Städte live auf einer fotorealistischen 3D-Karte: die echten Linien, die echten Haltestellen und der Fahrplan von heute."
    />
    <!-- /page:head -->
  </head>
  <body>
    <div id="root"></div>
    <!-- page:body -->
    <!-- /page:body -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
