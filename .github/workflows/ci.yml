name: CI

# One run per commit, not one per trigger: a branch with an open PR fires
# both `push` and `pull_request` for every push – same commit, twice the
# pipeline. Runs of the same branch share a group and the newer run
# cancels the older (which also stops outdated runs when pushes arrive in
# quick succession). Scheduled and manual runs get a group of their own:
# a nightly mid-refresh must never be cancelled by a late-night push.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('solo-{0}', github.run_id) || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
    # Prose alone starts nothing. There is no code to check in a README
    # edit and nothing new to ship – neither the markdown nor docs/ (the
    # README's screenshots) enters dist, and no build or test reads them –
    # so a push (or a PR) that touches only .md files and docs/ skips the
    # whole pipeline. A commit that changes prose AND code still runs it
    # in full: the filter looks at everything the push touched, not at
    # each file. Nightly and manual runs carry no paths at all and are
    # unaffected.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Refresh the GTFS schedule, as the nightly run does'
        type: boolean
        default: false
      refresh_osm:
        description: 'Also refresh the OSM data: network and terrain heights (otherwise Sunday only), lamps, airfield lights, buoys and lighthouses (otherwise the first Sunday of the month only)'
        type: boolean
        default: false
      deploy_preview:
        description: 'Deploy THIS branch to the live site (replaces production until main is deployed again)'
        type: boolean
        default: false
      restore_production:
        description: 'Put the last deployed main build back on the live site (no build, no tests – takes a minute)'
        type: boolean
        default: false
  schedule:
    # Nightly data refresh, every night (every second night was tried, to
    # spare Actions minutes, and dropped again): GTFS schedule every
    # night, OSM network and terrain heights only once a week, the lights
    # and seamarks once a month (see the refresh step), then typecheck,
    # unit tests, build and deploy – without the E2E suite, see that step
    # (02:30 UTC ≈ 03:30/04:30 Berlin time).
    - cron: '30 2 * * *'

permissions:
  contents: read

env:
  # Cesium Ion token of the deployed site. Restricted to
  # minigermany3d.com in the Ion dashboard, so it is useless
  # anywhere else and does not need to be a secret – it ships inside the
  # browser bundle regardless. Every build uses it, including the ones
  # that never leave CI: builds of one source tree have to be byte-equal
  # for a later run to reuse one (see "Identify the source tree"), and a
  # second token would break that. A build downloaded and served from
  # somewhere other than that domain falls back to the wireframe globe.
  ION_TOKEN_DEPLOY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlhQN3BHeHU1cE5FUGxsSnYiLCJqdGkiOiIyNTExMGU2Yi03ZmRkLTQ4ZGQtYjZjOS03YWZjNGNkMTE5MGEiLCJpZCI6NDY3MjAyLCJzdWIiOiJMYW1wZSIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJNaW5pIEdlcm1hbnkgM0QiLCJpYXQiOjE3ODkwNTcwODl9.WCStuvJT4BrUy9_nvfL9RtaSuk-yvWE9xjmGOS3IoWg
  # The Mapbox token for the flat map, the same way: public, and locked
  # to minigermany3d.com in the Mapbox account (see src/config.ts)
  MAPBOX_TOKEN_DEPLOY: pk.eyJ1IjoibGFtcGVuYmF1ZXIiLCJhIjoiY211MHY3M2oxMTU1MjJ6czhhZGlxa2Z0OCJ9.fclX9yNUNKjQUowdd-4X2Q

jobs:
  # A restore re-deploys an artifact that already passed all of this on
  # this very commit – running it again would cost 18 minutes to learn
  # nothing, and the live site would wear the preview for all of them.
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.restore_production) }}
    runs-on: ubuntu-latest
    # The E2E suite is what fills this: 35 tests that each boot Cesium
    # under SwiftShader, ~21 minutes of the run on a good day, and a single
    # failure adds the retry of that spec's whole file on top (app.spec is
    # 7 minutes of it). At 30 the cap cut a green run one test short of the
    # finish; 45 leaves room for the retry the `retries: 1` setting exists
    # for, instead of turning one flake into a cancelled run.
    #
    # A run that refreshes data has the pipeline in front of all that: two
    # Overpass queries and a Mapterhorn pass per city on the weekly OSM
    # refresh, thirteen cities one after the other, each of them minutes
    # when the mirrors are slow – 10 to 25 minutes before the first test
    # runs. Those runs get 75, so that a slow Overpass night does not
    # cancel the week's refresh just before it is committed (the nightly
    # run skips the E2E suite, see below, but the Overpass part alone can
    # take that long). A cancelled run loses no data, but the week.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.refresh_data || inputs.refresh_osm) && 75 || 45 }}
    permissions:
      # The nightly run pushes the refreshed src/cities data files back to main
      contents: write
      # The reuse probe looks through earlier runs' artifacts. An explicit
      # permissions block grants nothing it does not name, so this line is
      # what keeps that API call out of a 403.
      actions: read
    outputs:
      # Commit the deploy job must match against the live main branch –
      # for nightly runs this is the freshly pushed data commit.
      deploy_sha: ${{ steps.datacommit.outputs.sha || github.sha }}
      # "false" only on a nightly run that found nothing new (see datacheck).
      data_changed: ${{ steps.datacheck.outputs.changed }}
      # Which run holds the build to deploy, and under which name: this
      # run, unless an earlier one had already built this very tree.
      artifact_name: production-dist-${{ steps.tree.outputs.sha }}
      artifact_run_id: ${{ steps.reuse.outputs.run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` is the same unpack on every run – 553 packages out of an
      # already warm download cache, 23 000 files of which Cesium alone is
      # a seventh. It is disk, not network, and the hosted runners vary
      # wildly at it: the identical lockfile has taken 50 seconds on one
      # run and 7 minutes on the next. Caching the unpacked tree keys that
      # work to the lockfile, so it happens once per dependency change
      # instead of once per run, and a restore is one tar stream.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # npm runs this as a postinstall, so a cache hit skips it – and
      # public/cesium is git-ignored, generated, and needed by the build
      # and by every test. Cheap enough (a tenth of a second) to just do
      # unconditionally rather than to branch on.
      - name: Copy Cesium static assets
        run: node scripts/copy-cesium-assets.mjs

      # Nightly only: fetch the current OSM geometry and GTFS departures,
      # city by city. The scripts write their output files only after
      # successful processing, so a failed fetch leaves the previous data
      # intact – and every test below still validates the refreshed
      # dataset before anything is committed or deployed. One city's
      # failure does not cost the others their refresh.
      # The feed is 280 MB and changes about weekly, while the refresh
      # runs nightly: its Last-Modified is the cache key, so an unchanged
      # feed is restored from the cache and only a new one is downloaded.
      # No restore-keys – an older feed must never stand in for a newer
      # one. Without an answer from the server the key is today's date:
      # one download, kept for nothing, exactly what happened before.
      - name: Which GTFS feed is current? (nightly or on request)
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.refresh_osm
        id: feed
        run: |
          modified="$(curl -sI --max-time 30 https://download.gtfs.de/germany/free/latest.zip \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "last-modified" { print $2 }')"
          echo "Feed last modified: ${modified:-unknown}"
          key="$(printf '%s' "${modified:-$(date -u +%F)}" | tr -c 'A-Za-z0-9' '-')"
          echo "key=gtfs-feed-$key" >> "$GITHUB_OUTPUT"

      - name: Restore the GTFS feed (nightly or on request)
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.refresh_osm
        uses: actions/cache@v6
        with:
          path: scripts/.cache/gtfs.zip
          key: ${{ steps.feed.outputs.key }}

      - name: Refresh network & schedule data (nightly or on request)
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.refresh_osm
        env:
          FORCE_OSM: ${{ inputs.refresh_osm }}
          # The chosen service day per city, for the data commit's message
          SERVICE_DAY_LOG: ${{ runner.temp }}/service-days.txt
        run: |
          cities="$(node --input-type=module -e "import { allCitySlugs } from './scripts/lib/city.mjs'; console.log(allCitySlugs().join(' '))")"
          echo "Cities: $cities"
          # The OSM network changes rarely – fetch it only once a week
          # (Sunday night) to spare the public Overpass mirrors, or when a
          # manual run asks for it. A failed fetch (mirrors overloaded or
          # unreachable) keeps the previous network data and must not
          # block the GTFS refresh. The lamps, the airfield lights, the
          # buoys and the lighthouses change slower still – mapped once,
          # touched rarely – and the lamps step is the one that runs into
          # Overpass's rate limits, so those four go only on the first
          # Sunday of the month (or on request). Nothing is lost between:
          # every file is byte-stable, a run that fetched nothing new
          # commits nothing, and a month's wait is for a change nobody
          # would see sooner.
          refresh_network=false
          refresh_lights=false
          if [ "$(date +%u)" -eq 7 ] || [ "$FORCE_OSM" = "true" ]; then
            refresh_network=true
            # %-d: no leading zero, which [ ] would read but [[ ]] would not
            if [ "$(date +%-d)" -le 7 ] || [ "$FORCE_OSM" = "true" ]; then refresh_lights=true; fi
          fi
          if [ "$refresh_network" = "true" ]; then
            if [ "$refresh_lights" = "true" ]; then
              echo "OSM refresh: network, heights, lamps, airfield lights, buoys and lighthouses (first Sunday of the month, or on request)"
            else
              echo "OSM refresh: network and heights (the lights and seamarks go on the first Sunday of the month)"
            fi
            for city in $cities; do
              if npm run data:update -- --city "$city"; then
                npm run data:simplify -- --city "$city"
                # Terrain heights (Mapterhorn tiles) per route vertex.
                # PREV_NETWORK lets unchanged geometry reuse the committed
                # heights, so tiles are only fetched for actual changes. Soft
                # failure: without heights the app falls back to clamping
                # the routes onto the 3D tiles – worse GPU load, but correct.
                git show "HEAD:src/cities/$city/network.json" > "$RUNNER_TEMP/network-prev.json" || true
                PREV_NETWORK="$RUNNER_TEMP/network-prev.json" npm run data:heights -- --city "$city" || echo "::warning::$city: route height refresh failed – routes fall back to ground clamping."
                # The monthly tier – the next city otherwise
                [ "$refresh_lights" = "true" ] || continue
                # Street lamps along the refreshed routes (OSM + the same
                # terrain tiles). PREV_LAMPS reuses the committed heights for
                # lamps that did not move, so tiles are only fetched for new ones.
                # Soft failure: the previous lamp set stays in place.
                git show "HEAD:src/cities/$city/street-lamps.json" > "$RUNNER_TEMP/lamps-prev.json" || true
                PREV_LAMPS="$RUNNER_TEMP/lamps-prev.json" npm run data:lamps -- --city "$city" || echo "::warning::$city: street lamp refresh failed – keeping the previous lamp set."
                # The airfield lighting (OSM navigationaid nodes + the same
                # terrain tiles), with the same height reuse. Soft failure:
                # the previous lights stay in place.
                git show "HEAD:src/cities/$city/airfield-lights.json" > "$RUNNER_TEMP/airfield-prev.json" || true
                PREV_AIRFIELD_LIGHTS="$RUNNER_TEMP/airfield-prev.json" npm run data:airfield-lights -- --city "$city" || echo "::warning::$city: airfield lighting refresh failed – keeping the previous lights."
                # The buoys (OSM seamark nodes; no heights – the map clamps
                # them to the tiles). PREV_BUOYS only guards against a
                # half-synced mirror. Soft failure: the previous marks stay.
                git show "HEAD:src/cities/$city/buoys.json" > "$RUNNER_TEMP/buoys-prev.json" || true
                PREV_BUOYS="$RUNNER_TEMP/buoys-prev.json" npm run data:buoys -- --city "$city" || echo "::warning::$city: buoy refresh failed – keeping the previous marks."
                # The lighthouses and pier lights (OSM seamark tags; no
                # heights – the map sets them on the tiles' towers)
                git show "HEAD:src/cities/$city/lighthouses.json" > "$RUNNER_TEMP/lighthouses-prev.json" || true
                PREV_LIGHTHOUSES="$RUNNER_TEMP/lighthouses-prev.json" npm run data:lighthouses -- --city "$city" || echo "::warning::$city: lighthouse refresh failed – keeping the previous lights."
              else
                echo "::warning::$city: OSM network refresh failed (Overpass mirrors unreachable) – keeping the previous network data."
              fi
            done
          else
            echo "OSM refresh skipped – runs Sunday night (the lights and seamarks on the first Sunday of the month), or on request via refresh_osm."
          fi
          # The GTFS feed is downloaded once (scripts/.cache – or restored
          # from the cache above), unpacked once and scanned ONCE for every
          # city – the script picks each city's trips out of the same pass
          # (a city at a time was thirteen scans of the 2.2 GB
          # stop_times.txt, ten minutes a night). A city without trips
          # keeps its previous schedule, with a warning annotation from the
          # script; a feed that serves no city at all fails the run, as it
          # always did.
          npm run data:gtfs

      # What the build is made OF, not which commit asked for it: the
      # deployable output is a pure function of the source tree, so two
      # runs of the same tree produce interchangeable artifacts. That is
      # what lets a preview reuse a push's build instead of repeating 15
      # minutes of E2E. It has to be read AFTER the refresh above, or a
      # nightly build would be published under the pre-refresh tree.
      # `git add -A` stages the refreshed data (nothing on a normal run,
      # and never anything gitignored); write-tree then hashes it.
      - name: Identify the source tree
        id: tree
        run: |
          git add -A
          echo "sha=$(git write-tree)" >> "$GITHUB_OUTPUT"
          git reset -q

      # A nightly run exists to ship fresh data, so ask right here whether
      # there is any – on a quiet night everything below is skipped and the
      # run ends in about a minute instead of ten to sixteen. This is only
      # meaningful because the data scripts write byte-stable output for
      # unchanged input (no generation date in the files, guarded by
      # tests/schedule-data.test.ts).
      #
      # Pushes and manual runs always continue: they test the code, and a
      # manual run is the way to force the full pipeline on a quiet day.
      - name: Anything new to test? (nightly)
        id: datacheck
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- src/cities; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Feed unchanged – skipping tests, build and deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Has this exact source tree already been built and kept? Then a
      # preview does not need to build it again - and skipping that means
      # skipping the 15 minutes of E2E behind it, which is the whole
      # reason this exists. Only deploy_preview asks: a push must still
      # test its own code, and main's deploys are cheap to keep honest.
      - name: Reusable build for this tree?
        id: reuse
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.deploy_preview
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.sha }}
        run: |
          hit="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"production-dist-$TREE\" and .expired == false)
                  | \"\(.created_at) \(.workflow_run.id)\"" | sort -r | head -n 1)"
          if [ -n "$hit" ]; then
            run_id="$(echo "$hit" | cut -d' ' -f2)"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "::notice::Tree $TREE was already built by run $run_id - reusing it, skipping build and tests."
          else
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "No artifact for tree $TREE - building and testing it."
          fi

      # Every step below runs only on something new (see datacheck). They
      # need the explicit success(): an `if:` of one's own replaces the
      # implicit one, and a step without it runs even after a failure.
      - name: Typecheck & unit tests (Vitest)
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == ''
        run: |
          npm run typecheck
          npm test

      - name: PHP twin parity tests (api/realtime.php, api/ais.php, api/aircraft.php)
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == ''
        run: |
          node scripts/test-php-parser.mjs
          node scripts/test-ais-parity.mjs
          node scripts/test-ais-state.mjs
          node scripts/test-ais-archive-parity.mjs
          node scripts/test-aircraft-parity.mjs
          node scripts/test-aircraft-archive-parity.mjs

      - name: Production build
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == ''
        run: |
          # Every build gets the domain-restricted token, because every
          # build is now a deploy candidate: the artifact is keyed by the
          # source tree it was built from and reused by any later run of
          # that same tree (see BUILD_TREE), which only holds if they are
          # byte-identical. The token is domain-locked and lives in this
          # file in the clear, so nothing is given away by using it
          # everywhere; the E2E suite runs against the dev server, not
          # this build, so it does not care either way.
          export VITE_CESIUM_ION_TOKEN="$ION_TOKEN_DEPLOY"
          export VITE_MAPBOX_TOKEN="$MAPBOX_TOKEN_DEPLOY"
          # The provider named in the legal and privacy notices
          # (src/lib/legal.ts) comes from the repository's secrets, never
          # from the source. Missing, the notices show placeholders.
          export VITE_OPERATOR_NAME="${{ secrets.OPERATOR_NAME }}"
          export VITE_OPERATOR_STREET="${{ secrets.OPERATOR_STREET }}"
          export VITE_OPERATOR_PLACE="${{ secrets.OPERATOR_PLACE }}"
          export VITE_OPERATOR_EMAIL="${{ secrets.OPERATOR_EMAIL }}"
          npm run build

      # Not on the nightly run: the suite is what the
      # run's twenty minutes went into – fifteen of them, under
      # SwiftShader – and it tests the code, which the night does not
      # change and whose push run already had the suite. Of the data
      # it sees Rostock alone, offline, and what it reads there (the
      # night lines after midnight, the tram tunnel, vehicles out) the
      # unit tests pin per city, for every city. In 34 nightly runs it
      # failed once, on a runner timing flake. A manual refresh_data run
      # keeps the full suite: it is started to look at something. The
      # remaining risk is deliberate: the night deploys main on the
      # unit tests alone, so a push whose own E2E run was left red would
      # go out with the next data commit.
      - name: Install Playwright Chromium
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == '' && github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, offline mode)
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == '' && github.event_name != 'schedule'
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Only after all tests passed: persist the refreshed data on main.
      # Pushes via GITHUB_TOKEN do not trigger a new CI run – deploy
      # happens in this same workflow run below.
      - name: Commit refreshed data (nightly or on request)
        id: datacommit
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || inputs.refresh_data || inputs.refresh_osm)
        run: |
          git add -- src/cities
          if git diff --cached --quiet; then
            echo "Data unchanged – nothing to commit."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The service day each schedule was cut from is not in the file
            # (it moves with the calendar and would defeat the "anything
            # new?" check above) – it is recorded here instead
            {
              echo "Nightly data refresh (OSM network and/or GTFS schedule)"
              echo
              echo "Service days chosen (the busiest of the next three weeks per city):"
              cat "$RUNNER_TEMP/service-days.txt" 2>/dev/null || echo "(none – no GTFS refresh this run)"
            } | git commit -F -
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Every build that happened is kept, whatever branch it came from:
      # main's is the rollback target, and any other is what lets a later
      # preview of that same tree skip the whole suite. Same gate as the
      # build step itself – if we reused someone else's, there is nothing
      # here to package.
      - name: Prepare deployment artifact
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == ''
        run: |
          mkdir -p dist/api
          cp server/api/realtime.php dist/api/
          cp server/api/ais.php dist/api/
          cp server/api/aircraft.php dist/api/
          cp server/api/webcams.php dist/api/
          # No keys in here: the deploy and the restore job put them in
          # place right before the upload (see "Put the keys in place").
          # Every city's definition (the boxes ais.php subscribes with and
          # aircraft.php asks adsb.fi for)
          # and schedule (the trip ids realtime.php filters by) – the same
          # files the app and the pipeline read.
          for dir in src/cities/*/; do
            slug="$(basename "$dir")"
            mkdir -p "dist/api/cities/$slug"
            cp "$dir/city.json" "dist/api/cities/$slug/"
            if [ -f "$dir/schedule.json" ]; then
              cp "$dir/schedule.json" "dist/api/cities/$slug/"
            fi
          done

      - name: Upload deployment artifact
        if: >-
          success() && steps.datacheck.outputs.changed == 'true' &&
          steps.reuse.outputs.run_id == ''
        uses: actions/upload-artifact@v7
        with:
          # The tree is the identity – see "Identify the source tree".
          name: production-dist-${{ steps.tree.outputs.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          # main's is the restore job's rollback target and has to outlive
          # the run that made it; a branch's only has to survive until
          # someone previews that branch, which is minutes to hours.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}

  # Deploys on three occasions: a push or nightly run on main, a manual
  # run on main (the "deploy main again" button), and a manual run on any
  # branch with deploy_preview ticked – the way to try a branch out on the
  # real hosting without merging it. Taking a preview back down is the
  # restore job at the bottom, not this one.
  #
  # There is ONE target: the live docroot. A preview therefore REPLACES the
  # production site for everyone until main is deployed again (deliberate –
  # a subdomain or subdirectory would need its own docroot, its own Cesium
  # Ion domain, and would have to be swept up afterwards). The deploy
  # concurrency group keeps two of these from ever interleaving.
  deploy:
    name: Deploy
    needs: test
    if: >-
      needs.test.result == 'success' &&
      needs.test.outputs.data_changed == 'true' &&
      ((github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
         github.event_name == 'schedule')) ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_preview))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Downloading a build another run made (see artifact_run_id)
      actions: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # SSH host, user, and target directory (with trailing slash!) live in
      # repo secrets alongside DEPLOY_SSH_PASSWORD (Settings → Secrets → Actions).
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
      # Anything that is not main standing on the live site is a preview.
      IS_PREVIEW: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          # Usually this run's own build; for a preview that reused an
          # earlier build of the same tree, that other run's.
          name: ${{ needs.test.outputs.artifact_name }}
          run-id: ${{ needs.test.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: dist

      # The keys the PHP scripts read, from the repository secrets
      # (Settings → Secrets → Actions), are written here and not into the
      # artifact: anyone who can read the repository can download an
      # artifact. They go next to the scripts, where .htaccess keeps them
      # from the web. An artifact packed while the Windy key still went
      # into it carries an old one, so whatever the artifact brings is
      # dropped first.
      #  - WINDY_KEY → api/webcams-key.txt. Without it, api/webcams.php
      #    falls back to windy-api-key.txt beside the document root, or
      #    answers 503 and the app runs without webcams.
      #  - CRON_KEY → api/cron-key.txt, the key the two keeper crons send
      #    (api/ais?listen=…&key=…, api/aircraft?record=…&key=…). Without
      #    it anyone may start a keeper, as before there was a key.
      - name: Put the keys in place
        env:
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          rm -f dist/api/webcams-key.txt dist/api/cron-key.txt
          if [ -n "$WINDY_KEY" ]; then
            printf '%s' "$WINDY_KEY" > dist/api/webcams-key.txt
          fi
          if [ -n "$CRON_KEY" ]; then
            printf '%s' "$CRON_KEY" > dist/api/cron-key.txt
          else
            echo "::warning::Secret CRON_KEY is not set – anyone may start the AIS and ADS-B keepers."
          fi

      - name: Upload via rsync over SSH
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          # For nightly runs this is the freshly pushed data commit, for
          # pushes the triggering commit – deploy only if main still points
          # at it (nothing newer was merged mid-run).
          EXPECTED_SHA: ${{ needs.test.outputs.deploy_sha }}
        run: |
          # Only main races with itself. A preview deploys the branch the
          # maintainer picked, whatever main happens to be doing.
          if [ "$IS_PREVIEW" != "true" ]; then
            git ls-remote --exit-code origin refs/heads/main > "$RUNNER_TEMP/main-ref"
            current_main_sha="$(cut -f1 "$RUNNER_TEMP/main-ref")"
            if [ "$current_main_sha" != "$EXPECTED_SHA" ]; then
              echo "::notice::Deploy skipped: $EXPECTED_SHA is no longer the current main commit ($current_main_sha)."
              exit 0
            fi
          fi
          if [ -z "$SSHPASS" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_USER" ] || [ -z "$DEPLOY_TARGET_DIR" ]; then
            echo "::error::Secrets DEPLOY_SSH_PASSWORD, DEPLOY_SSH_HOST, DEPLOY_SSH_USER, and DEPLOY_TARGET_DIR must be set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            dist/ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_TARGET_DIR"
          echo "✅ Deployed to https://minigermany3d.com"

      # A preview stands on the live site until someone takes it down, and
      # the only way down is deploying main. Say so where the run is read.
      - name: Note what is live now
        if: success()
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            {
              echo "### ⚠️ A preview is live"
              echo
              echo "**\`$GITHUB_REF_NAME\`** now stands on <https://minigermany3d.com> —"
              echo "for every visitor, not just for you."
              echo
              echo "It stays there until production is restored. To do that, run this"
              echo "workflow again on \`main\` (Actions → CI → Run workflow → Branch: main),"
              echo "or merge something into main."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Production is live" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`main\` ($GITHUB_SHA) is on <https://minigermany3d.com>." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Undo button for a preview: takes the artifact of the last successful
  # main deploy and puts it back, without building or testing anything.
  # Nothing untested reaches the site that way – it is byte for byte the
  # build that already passed the full suite on the commit it was made
  # from, with the keys put in as the deploy job does (no artifact
  # carries them). That is the whole point: re-running 15 minutes of E2E
  # on a commit that has already been green buys nothing while the
  # preview is still standing on the live site.
  #
  # The deploy job cannot double as this: it needs `test`, which a restore
  # skips, so `needs.test.result == 'success'` is false and it stands down
  # on its own. Both share the deploy concurrency group.
  restore:
    name: Restore production
    if: github.event_name == 'workflow_dispatch' && inputs.restore_production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Reading and downloading another run's artifact
      actions: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
    steps:
      # Every branch uploads a build now, and they are named by source
      # tree rather than by branch, so the run's branch is what tells
      # production apart from the rest: only main ever built production.
      - name: Find the last production build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main"
                                        and (.name | startswith("production-dist-")))
                  | "\(.created_at) \(.workflow_run.id) \(.workflow_run.head_sha) \(.name)"')"
          newest="$(printf '%s\n' "$artifacts" | sort -r | head -n 1)"
          if [ -z "$newest" ]; then
            echo "::error::No unexpired production build from a main run found. Deploy main normally (Run workflow → Branch: main) instead."
            exit 1
          fi
          echo "run_id=$(echo "$newest" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$newest" | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"
          echo "built=$(echo "$newest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$newest" | cut -d' ' -f4)" >> "$GITHUB_OUTPUT"

      - name: Download it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.find.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" --name "${{ steps.find.outputs.name }}" --dir dist
          # A truncated download would rsync --delete a half site into place
          test -s dist/index.html || { echo "::error::Artifact has no index.html – refusing to deploy it."; exit 1; }

      # As in the deploy job: the rsync deletes what it does not carry, so
      # a restore without the keys would take the webcams down and open the
      # keepers, and an artifact packed before the Windy key left it would
      # bring its old one back.
      - name: Put the keys in place
        env:
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          rm -f dist/api/webcams-key.txt dist/api/cron-key.txt
          if [ -n "$WINDY_KEY" ]; then
            printf '%s' "$WINDY_KEY" > dist/api/webcams-key.txt
          fi
          if [ -n "$CRON_KEY" ]; then
            printf '%s' "$CRON_KEY" > dist/api/cron-key.txt
          else
            echo "::warning::Secret CRON_KEY is not set – anyone may start the AIS and ADS-B keepers."
          fi

      - name: Upload via rsync over SSH
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_USER" ] || [ -z "$DEPLOY_TARGET_DIR" ]; then
            echo "::error::Secrets DEPLOY_SSH_PASSWORD, DEPLOY_SSH_HOST, DEPLOY_SSH_USER, and DEPLOY_TARGET_DIR must be set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            dist/ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_TARGET_DIR"
          echo "✅ Restored to https://minigermany3d.com"

      - name: Note what is live now
        if: success()
        env:
          RESTORED_SHA: ${{ steps.find.outputs.sha }}
          BUILT_AT: ${{ steps.find.outputs.built }}
        run: |
          {
            echo "### ✅ Production restored"
            echo
            echo "The main build \`$RESTORED_SHA\` (built $BUILT_AT) is back on"
            echo "<https://minigermany3d.com>."
            echo
            echo "No rebuild and no test run – this is the same artifact that passed"
            echo "the full suite when that commit was pushed."
          } >> "$GITHUB_STEP_SUMMARY"
