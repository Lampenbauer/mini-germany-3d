name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly data refresh: GTFS schedule every night, OSM network only
    # every third night (see the refresh step), then the full
    # test/build/deploy pipeline (02:30 UTC ≈ 03:30/04:30 Berlin time).
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The nightly run pushes the refreshed src/data files back to main
      contents: write
    outputs:
      # Commit the deploy job must match against the live main branch –
      # for nightly runs this is the freshly pushed data commit.
      deploy_sha: ${{ steps.datacommit.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nightly only: fetch the current OSM geometry and GTFS departures.
      # The scripts write their output files only after successful
      # processing, so a failed fetch leaves the previous data intact –
      # and every test below still validates the refreshed dataset before
      # anything is committed or deployed.
      - name: Refresh network & schedule data (nightly)
        if: github.event_name == 'schedule'
        run: |
          # The OSM network changes rarely – fetch it only every third
          # night (epoch day modulo 3, stable across month boundaries)
          # to spare the public Overpass mirrors.
          if [ $(( $(date +%s) / 86400 % 3 )) -eq 0 ]; then
            npm run data:update
            npm run data:simplify
          else
            echo "OSM network refresh skipped – runs every third night."
          fi
          npm run data:gtfs

      - name: Typecheck & unit tests (Vitest)
        run: |
          npm run typecheck
          npm test

      - name: PHP parser parity test (api/realtime.php)
        run: node scripts/test-php-parser.mjs

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, offline mode)
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Nightly only, after all tests passed: persist the refreshed data on
      # main. Pushes via GITHUB_TOKEN do not trigger a new CI run – deploy
      # happens in this same workflow run below.
      - name: Commit refreshed data (nightly)
        id: datacommit
        if: github.event_name == 'schedule'
        run: |
          git add src/data/network.json src/data/schedule.json
          if git diff --cached --quiet; then
            echo "Data unchanged – nothing to commit."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Nightly data refresh (OSM network and/or GTFS schedule)"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare deployment artifact
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           github.event_name == 'schedule')
        run: |
          mkdir -p dist/api
          cp server/api/realtime.php dist/api/
          cp src/data/schedule.json dist/api/schedule.json

      - name: Upload deployment artifact
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           github.event_name == 'schedule')
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy (all-inkl)
    needs: test
    if: >-
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-all-inkl
      cancel-in-progress: false
    env:
      # SSH host, user, and target directory (with trailing slash!) live in
      # repo secrets alongside KAS_SSH_PASSWORD (Settings → Secrets → Actions).
      KAS_SSH_HOST: ${{ secrets.KAS_SSH_HOST }}
      KAS_SSH_USER: ${{ secrets.KAS_SSH_USER }}
      KAS_TARGET_DIR: ${{ secrets.KAS_TARGET_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist

      - name: Upload via rsync over SSH
        env:
          SSHPASS: ${{ secrets.KAS_SSH_PASSWORD }}
          # For nightly runs this is the freshly pushed data commit, for
          # pushes the triggering commit – deploy only if main still points
          # at it (nothing newer was merged mid-run).
          EXPECTED_SHA: ${{ needs.test.outputs.deploy_sha }}
        run: |
          git ls-remote --exit-code origin refs/heads/main > "$RUNNER_TEMP/main-ref"
          current_main_sha="$(cut -f1 "$RUNNER_TEMP/main-ref")"
          if [ "$current_main_sha" != "$EXPECTED_SHA" ]; then
            echo "::notice::Deploy skipped: $EXPECTED_SHA is no longer the current main commit ($current_main_sha)."
            exit 0
          fi
          if [ -z "$SSHPASS" ] || [ -z "$KAS_SSH_HOST" ] || [ -z "$KAS_SSH_USER" ] || [ -z "$KAS_TARGET_DIR" ]; then
            echo "::error::Secrets KAS_SSH_PASSWORD, KAS_SSH_HOST, KAS_SSH_USER, and KAS_TARGET_DIR must be set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            dist/ "$KAS_SSH_USER@$KAS_SSH_HOST:$KAS_TARGET_DIR"
          echo "✅ Deployed to https://minirostock3d.lampenbauer.com"
